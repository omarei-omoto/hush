body:
  - type: markdown
    attributes:
      value: |
        Found a way to read a secret you should not be able to? Please use a private advisory instead:
        https://github.com/omarei-omoto/hush/security/advisories/new
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: "`hush --version`, your OS, which agent, and the output of `hush doctor` (it never prints a value)."
