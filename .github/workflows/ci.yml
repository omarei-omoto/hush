name: CI

on:
  push:
    branches: [main]
  pull_request:

# A read-only token is all this needs.
permissions:
  contents: read

jobs:
  test:
    name: test · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the others.
      fail-fast: false
      matrix:
        # macOS is where it is developed; ubuntu is where most people will run
        # it and where the platform-guarded paths actually get exercised.
        os: [ubuntu-latest, macos-latest]
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # devDependencies only — there are no runtime dependencies to install.
      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      # `age` turns on the hardware-path tests, which drive a real C2SP plugin
      # through the real age binary. Without it they skip.
      - name: install age
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y age
          else
            brew install age
          fi

      # Run once and read the summary from that run: running the suite twice to
      # inspect it is a good way to have the two runs disagree.
      - name: test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.out
      - name: summary
        if: always()
        shell: bash
        run: grep -E '^# (tests|pass|fail|skipped)' /tmp/test.out || true

  package:
    name: the published package runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - run: npm ci
      # The same source must build to the same bytes, twice, from two different
      # directories — otherwise nobody can check a tarball against its commit.
      - name: the build is reproducible
        run: npm run build:check
      # Node refuses to strip types under node_modules, so an installed copy has
      # to run the built output. This is the check that would have caught the
      # package being completely unusable while every other test passed.
      - run: npm run build
      - name: pack, install elsewhere, and use it
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install /tmp/*.tgz
          export HUSH_HOME=/tmp/hushhome HUSH_NO_KEYCHAIN=1 HUSH_NO_NUDGE=1 NO_COLOR=1
          ./node_modules/.bin/hush --version
          ./node_modules/.bin/hush id --create
          ./node_modules/.bin/hush init ci
          ./node_modules/.bin/hush set CI_KEY=ci_value_1234567890
          ./node_modules/.bin/hush run --quiet -- sh -c 'echo "$CI_KEY"' | grep -q 'redacted:CI_KEY'
          ./node_modules/.bin/hush verify

  binary:
    name: the single-file binary · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      # One pin for every build of the binary: .bun-version.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: npm ci
      - name: build, twice — the same source must give the same bytes
        shell: bash
        run: |
          set -euo pipefail
          npm run build:binaries
          node scripts/build-binaries.mjs --out /tmp/again
          diff release/SHA256SUMS /tmp/again/SHA256SUMS
      - name: install age
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y age
          else
            brew install age
          fi
      # The whole suite, with every CLI invocation going to the binary
      # (test/helpers/binary-shim.ts), plus the binary's own checks.
      - name: the suite against the binary
        shell: bash
        run: |
          set -euo pipefail
          bin="$(ls "$PWD"/release/hush-* | head -1)"
          echo "testing $bin"
          HUSH_TEST_BINARY="$bin" npm run test:binary 2>&1 | tee /tmp/test.out
      - name: summary
        if: always()
        shell: bash
        run: grep -E '^# (tests|pass|fail|skipped)' /tmp/test.out || true
      # The Windows binary is cross-built here, on Linux, exactly as the release
      # builds it; the Windows job below runs that file rather than a local build.
      - name: build the Windows binary for the Windows job
        if: runner.os == 'Linux'
        run: node scripts/build-binaries.mjs --target windows-x64 --out /tmp/win
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: hush-windows-x64
          path: /tmp/win/hush-windows-x64.exe
          if-no-files-found: error

  windows:
    name: windows (beta) · the real Windows paths
    runs-on: windows-latest
    # Beta: this job reports and does not block until Windows has had real use.
    # The main suite is POSIX-shaped (file modes, sh); this exercises what is
    # Windows-specific end to end: DPAPI for the identity, npm.cmd through
    # cmd.exe, redaction, and the PowerShell hook.
    continue-on-error: true
    # For the Windows binary it tests, built by the binary job on Linux.
    needs: binary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - run: npm ci
      - name: platform tests
        run: node --test test/platform.test.ts
      - name: smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HUSH_HOME = Join-Path $env:RUNNER_TEMP 'hushhome'
          $env:HUSH_NO_NUDGE = '1'; $env:NO_COLOR = '1'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'src\cli.ts'
          node $cli --version
          node $cli id --create
          $id = node $cli id | Out-String
          if ($id -notmatch 'Windows DPAPI') { throw "identity is not in DPAPI: $id" }
          $proj = Join-Path $env:RUNNER_TEMP 'proj'; New-Item -ItemType Directory $proj | Out-Null; Set-Location $proj
          node $cli init win --no-agent
          node $cli add SMOKE_KEY=smoke_value_123456 --to default
          $o = node $cli run --quiet -- node -e "console.log(process.env.SMOKE_KEY)" | Out-String
          if ($o -notmatch 'redacted:SMOKE_KEY') { throw "the value was not injected and redacted: $o" }
          node $cli run --quiet -- npm --version
          if ($LASTEXITCODE -ne 0) { throw "npm.cmd did not run through hush" }
          node $cli verify
          $hook = node $cli hook powershell | Out-String
          if ($hook -notmatch 'ConvertFrom-Json') { throw "no PowerShell hook" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hush-windows-x64
          path: release-win
      - name: the Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A native command's failure does not stop PowerShell; check each one.
          $env:HUSH_TEST_BINARY = Join-Path $env:GITHUB_WORKSPACE 'release-win\hush-windows-x64.exe'
          & $env:HUSH_TEST_BINARY --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/binary.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  fuzz:
    name: deeper fuzzing
    runs-on: ubuntu-latest
    # Nightly rather than per-PR: the same search, many times over, which is
    # worth doing but not worth waiting for on every push.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - run: npm ci
      - run: HUSH_FUZZ_SCALE=40 node --test test/fuzz.test.ts
