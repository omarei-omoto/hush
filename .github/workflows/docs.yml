name: Docs

# The docs site on GitHub Pages at tryhush.dev: a home page, the README and
# docs/ as a Starlight site (website/, content from scripts/build-docs.mjs), and
# the app running on made-up keys (scripts/build-demo.mjs), rebuilt whenever the
# README, the guide, the docs or the app change on main. No other branch
# deploys: the site describes what `npm i -g @omarei/hush` installs.
# One-time setup: Settings → Pages → Source: "GitHub Actions", and
# Custom domain: tryhush.dev (the DNS records are in RELEASING.md).
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "RELEASING.md"
      - "RESEARCH.md"
      - "CODE_OF_CONDUCT.md"
      - "docs/**"
      - "src/**"
      - "scripts/build-docs.mjs"
      - "scripts/check-site.mjs"
      - "scripts/build-demo.mjs"
      - "website/**"
      - "assets/**"
      - "scripts/gen-commands.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
      # The command reference must match the program, and every link must land.
      - name: the command reference is current
        run: node scripts/gen-commands.mjs --check
      # The site's own dependencies (Astro, Starlight), pinned by website's
      # lockfile. They never touch the hush package, which has none.
      - name: install
        run: npm ci --prefix website
      # The content and the live app, then astro build, then
      # scripts/check-site.mjs: every link and anchor resolves and no script
      # comes from another host.
      - name: build
        run: npm run build --prefix website
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1