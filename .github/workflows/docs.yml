name: Docs

# The docs site (scripts/build-docs.mjs) on GitHub Pages, rebuilt whenever the
# README, the guide or the docs change on main. One-time setup: Settings →
# Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "RELEASING.md"
      - "RESEARCH.md"
      - "CODE_OF_CONDUCT.md"
      - "docs/**"
      - "src/cli/help.ts"
      - "scripts/build-docs.mjs"
      - "scripts/markdown.mjs"
      - "scripts/gen-commands.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      # The command reference must match the program, and every link must land.
      - name: the command reference is current
        run: node scripts/gen-commands.mjs --check
      - name: build
        run: node scripts/build-docs.mjs --out site
      - name: every link on the site resolves
        run: node --test --test-name-pattern "the real site" test/docs-site.test.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
