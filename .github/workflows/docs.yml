name: Docs

# The docs site on GitHub Pages at tryhush.dev: the README and docs/ as a
# Starlight site (website/, content from scripts/build-docs.mjs), rebuilt
# whenever the README, the guide or the docs change. Built from beta while beta
# is where the current docs are; main deploys too, so merging beta changes
# nothing. One-time setup: Settings → Pages → Source: "GitHub Actions", and
# Custom domain: tryhush.dev (the DNS records are in RELEASING.md).
on:
  push:
    branches: [main, beta]
    paths:
      - "README.md"
      - "SECURITY.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "RELEASING.md"
      - "RESEARCH.md"
      - "CODE_OF_CONDUCT.md"
      - "docs/**"
      - "src/cli/help.ts"
      - "scripts/build-docs.mjs"
      - "scripts/check-site.mjs"
      - "website/**"
      - "assets/**"
      - "scripts/gen-commands.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
      # The command reference must match the program, and every link must land.
      - name: the command reference is current
        run: node scripts/gen-commands.mjs --check
      # The site's own dependencies (Astro, Starlight), pinned by website's
      # lockfile. They never touch the hush package, which has none.
      - name: install
        run: npm ci --prefix website
      # The content, then astro build, then scripts/check-site.mjs: every link
      # and anchor resolves and no script comes from another host.
      - name: build
        run: npm run build --prefix website
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4