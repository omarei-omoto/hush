name: Release

# Publishing is a tag, not a click: push `v0.5.0` and this checks, builds and
# publishes exactly that commit.
#
# No npm token exists anywhere. npm's trusted publishing verifies this
# workflow's GitHub OIDC identity against the publisher configured on the
# package (npmjs.com → @omarei/hush → Settings → Trusted publishing:
# omarei-omoto/hush, workflow release.yml).
#
# The publisher allows `npm publish`, so a tag that passes the checks goes
# live directly. For a human approval step instead, switch the last step to
# `npm stage publish` and approve each release with 2FA on npmjs.com (the
# package's Staged Packages tab) or with `npm stage approve <stage-id>`.
#
# The same tag also builds the single-file binaries (F-8): built once on Linux
# for every platform, tested, the macOS ones signed and notarized when an Apple
# Developer ID is configured, checksummed, given a GitHub build-provenance
# attestation, and attached to a GitHub release with the package-manager
# manifests. RELEASING.md lists the secrets, all optional.
#
# Two channels, chosen by the tag itself. `v0.11.0` is a release: npm `latest`,
# a normal GitHub release, the Homebrew tap and the MCP registry. A tag with a
# prerelease part — `v0.11.0-beta.1` — is the beta channel: npm `beta` (so
# `npm i -g @omarei/hush` never picks it up, `npm i -g @omarei/hush@beta`
# does), a GitHub release marked prerelease (so install.sh's
# releases/latest/download never serves it), and no tap or registry update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: the tagged commit passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"

      # A tag that disagrees with package.json would publish a version nobody
      # tagged, so refuse before anything else runs.
      - name: tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          src="$(node -p "require('fs').readFileSync('src/version.ts','utf8').match(/VERSION = \"([^\"]+)\"/)[1]")"
          mcp="$(node -p "require('./server.json').version")"
          echo "tag=$tag package.json=$pkg src/version.ts=$src server.json=$mcp"
          test "$tag" = "$pkg" && test "$pkg" = "$src" && test "$pkg" = "$mcp"

      - run: npm ci
      - run: npm run typecheck
      - name: the build is reproducible
        run: npm run build:check

      - name: install age
        run: sudo apt-get update && sudo apt-get install -y age

      - run: npm test

  publish:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token trusted publishing exchanges for a one-time publish credential.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberately no `registry-url`: with it, setup-node writes an
      # `_authToken=${NODE_AUTH_TOKEN}` line that expands to empty, npm treats
      # that as "already authenticated", never attempts the OIDC exchange, and
      # the publish fails with a misleading 404.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"

      # Trusted publishing needs npm 11.5.1 or later (staged publishing, 11.15.0).
      - run: npm install -g npm@latest
      - run: npm --version

      # devDependencies are needed: `prepack` builds dist/ with tsc.
      - run: npm ci

      # Provenance links the tarball to this workflow run and this commit, so
      # anyone can check what they installed came from here (npm shows it on
      # the package page). Trusted publishing attaches it anyway; the flag
      # makes a publish that cannot attach it fail rather than go out without.
      - name: npm publish (latest, or beta for a prerelease tag)
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            *-*) channel=beta ;;
            *) channel=latest ;;
          esac
          echo "publishing ${GITHUB_REF_NAME#v} to the $channel channel"
          npm publish --provenance --access public --tag "$channel"

      # The official MCP registry, signed in with this workflow's GitHub OIDC
      # identity (the io.github.omarei-omoto/* namespace) — no token. The
      # publisher is pinned and checked against the registry release's sums.
      - name: list this version in the MCP registry
        # The registry lists the newest version it is given; a beta is not that.
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mcpp.tgz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcpp.tgz" | sha256sum -c -
          tar xzf /tmp/mcpp.tgz -C /tmp mcp-publisher
          # The registry checks npm for this version, and npm takes a moment to
          # serve a fresh publish (0.10.0's listing failed on exactly that).
          v="$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            [ "$(npm view "@omarei/hush@$v" version 2>/dev/null)" = "$v" ] && break
            sleep 10
          done
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish server.json

  binaries:
    name: build and test the binaries
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: npm ci
      - name: build every target, twice, and compare
        run: |
          set -euo pipefail
          node scripts/build-binaries.mjs --all
          node scripts/build-binaries.mjs --all --out /tmp/again
          diff release/SHA256SUMS /tmp/again/SHA256SUMS
      - name: install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: the suite against the Linux binary
        run: HUSH_TEST_BINARY="$PWD/release/hush-linux-x64" npm run test:binary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: release/hush-*
          if-no-files-found: error

  sign-macos:
    name: sign and notarize the macOS binaries
    needs: binaries
    runs-on: macos-latest
    env:
      # All four, or the binaries ship ad-hoc signed (they run; curl and
      # Homebrew do not quarantine, so Gatekeeper is not involved).
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: release
      - name: sign with the Developer ID (hardened runtime, one entitlement)
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain"
          for f in release/hush-darwin-arm64 release/hush-darwin-x64; do
            chmod +x "$f"
            codesign --force --timestamp --options runtime \
              --entitlements scripts/macos-entitlements.plist \
              --identifier dev.omarei.hush --sign "$APPLE_SIGNING_IDENTITY" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done
      - name: notarize
        if: env.APPLE_CERTIFICATE_P12 != '' && env.APPLE_NOTARY_KEY != ''
        run: |
          set -euo pipefail
          echo "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          ditto -c -k release/hush-darwin-arm64 "$RUNNER_TEMP/arm64.zip"
          ditto -c -k release/hush-darwin-x64 "$RUNNER_TEMP/x64.zip"
          for z in arm64 x64; do
            xcrun notarytool submit "$RUNNER_TEMP/$z.zip" --wait \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER"
          done
          rm -f "$RUNNER_TEMP/notary.p8"
      # Signed or not, the macOS binary has to start and do real work here.
      - name: the macOS binary runs
        run: |
          set -euo pipefail
          chmod +x release/hush-darwin-arm64
          release/hush-darwin-arm64 --version
          export HUSH_HOME="$RUNNER_TEMP/h" HUSH_NO_KEYCHAIN=1 HUSH_NO_NUDGE=1 NO_COLOR=1
          mkdir -p "$RUNNER_TEMP/p" && cd "$RUNNER_TEMP/p"
          "$GITHUB_WORKSPACE/release/hush-darwin-arm64" id --create
          "$GITHUB_WORKSPACE/release/hush-darwin-arm64" init smoke --no-agent
          "$GITHUB_WORKSPACE/release/hush-darwin-arm64" set K=smoke_value_123456
          "$GITHUB_WORKSPACE/release/hush-darwin-arm64" run --quiet -- sh -c 'echo "$K"' | grep -q 'redacted:K'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-final
          path: release/hush-*
          if-no-files-found: error

  github-release:
    name: attest and attach the binaries
    needs: [verify, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release and upload its files
      id-token: write        # the OIDC token the attestation is signed with
      attestations: write    # store the attestation on the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-final
          path: release
      # After signing: these are the bytes people download.
      - name: SHA256SUMS and manifests
        run: |
          set -euo pipefail
          cd release
          sha256sum hush-* | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          cd ..
          node scripts/package-manifests.mjs --version "${GITHUB_REF_NAME#v}" --sums release/SHA256SUMS --out release/manifests
          cp release/manifests/Formula/hush.rb release/hush.rb
          cp release/manifests/scoop/hush.json release/hush.json
          (cd release/manifests/winget && tar czf ../../winget-manifests.tar.gz .)
      # Sigstore-signed build provenance: `gh attestation verify <file> --repo
      # omarei-omoto/hush` proves which workflow and commit produced a binary.
      # scripts/install.sh checks it when gh is available.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/hush-*
            release/SHA256SUMS
      - name: release notes from the changelog
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## " v "( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md || echo "hush $v" > /tmp/notes.md
          case "$v" in
            *-*) printf '\n---\nThis is a **beta**. Install it with `npm i -g @omarei/hush@beta`, or download a binary below; the stable channel (`npm i -g @omarei/hush`, Homebrew, install.sh) is unchanged. Every binary is listed in SHA256SUMS and has a build-provenance attestation.\n' >> /tmp/notes.md ;;
            *) printf '\n---\nInstall: `curl -fsSL https://raw.githubusercontent.com/omarei-omoto/hush/main/scripts/install.sh | sh`, `brew install omarei-omoto/tap/hush`, or `npm i -g @omarei/hush`. Every binary is listed in SHA256SUMS and has a build-provenance attestation.\n' >> /tmp/notes.md ;;
          esac
      - name: create the release (or add to one made by hand)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(release/hush-* release/SHA256SUMS release/hush.rb release/hush.json release/winget-manifests.tar.gz)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            pre=()
            case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag "${pre[@]}" --title "hush ${GITHUB_REF_NAME#v}" --notes-file /tmp/notes.md
          fi
      # The tap updates itself from each release (its own workflow, its own
      # token). This step only makes that immediate, and only if a token with
      # Contents: write on omarei-omoto/homebrew-tap is configured.
      - name: update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != '' && !contains(github.ref_name, '-')
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/omarei-omoto/homebrew-tap.git" /tmp/tap
          mkdir -p /tmp/tap/Formula
          cp release/manifests/Formula/hush.rb /tmp/tap/Formula/hush.rb
          cd /tmp/tap
          git config user.name "hush release"
          git config user.email "hush-release@users.noreply.github.com"
          git add Formula/hush.rb
          git diff --cached --quiet || git commit -m "hush ${GITHUB_REF_NAME#v}"
          git push
