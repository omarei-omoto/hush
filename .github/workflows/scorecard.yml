name: Scorecard

# OpenSSF Scorecard: checks the project's own practices (pinned actions, token
# permissions, branch protection, signed releases, …) and publishes the result
# at scorecard.dev. It only publishes from the default branch.
on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 1"

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
