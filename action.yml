name: hush
description: Run CI steps with secrets from a hush vault, as a CI identity that can read only the sets it was given.
author: omarei
branding:
  icon: lock
  color: gray-dark

inputs:
  identity:
    description: >
      A CI identity's private key, from `hush ci create <name> --sets <set>,…`.
      Store it as a repository or environment secret and pass it here.
    required: true
  version:
    description: The hush version to install from npm (a version or a range; pin it).
    required: false
    default: latest

runs:
  using: composite
  steps:
    # The key is masked before anything else can print it, and handed to later
    # steps through the runner's own environment file — never written into the
    # workspace or a file of hush's.
    - name: hush identity
      shell: bash
      env:
        HUSH_ACTION_IDENTITY: ${{ inputs.identity }}
      run: |
        set -euo pipefail
        if [ -z "$HUSH_ACTION_IDENTITY" ]; then
          echo "::error title=hush::no identity given — create one with 'hush ci create <name> --sets <set>' and pass it as a secret"
          exit 1
        fi
        case "$HUSH_ACTION_IDENTITY" in
          hush_sk_*) ;;
          *) echo "::error title=hush::that does not look like a hush identity (it starts with hush_sk_)"; exit 1 ;;
        esac
        echo "::add-mask::$HUSH_ACTION_IDENTITY"
        {
          echo "HUSH_IDENTITY=$HUSH_ACTION_IDENTITY"
          echo "HUSH_NO_KEYCHAIN=1"
          echo "HUSH_NO_NUDGE=1"
        } >> "$GITHUB_ENV"

    - name: install hush
      shell: bash
      env:
        HUSH_ACTION_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if ! command -v node >/dev/null; then
          echo "::error title=hush::Node 22.6 or later is needed first — add actions/setup-node before this step"
          exit 1
        fi
        # npm verifies the tarball against its registry integrity hash, and the
        # package carries provenance tying it to the hush repository's release.
        npm install --global --no-fund --no-audit "@omarei/hush@${HUSH_ACTION_VERSION}"
        hush --version

    - name: check the identity can read the vault
      shell: bash
      run: |
        set -euo pipefail
        # Fails the job here, naming the problem, rather than in a later step
        # with a missing variable: not a member, a vault change nobody on this
        # identity accepted, or a signature that does not hold.
        hush doctor || true
        hush verify
